services:
  db:
    image: postgres:18
    environment:
      POSTGRES_PASSWORD: password
    volumes:
      - ./dbdata:/var/lib/postgresql/data
  redis:
    image: redis
  web:
    # Docker hack to wait until Postgres is up, then run stuff.
    command: bash -c "python manage.py migrate; python manage.py runserver_plus 0.0.0.0:8000"
    image: pastery
    build: .
    ports:
      - "8000:8000"
    volumes:
      - .:/code
    depends_on:
      - redis
      - db
    environment:
      IN_DOCKER: 1
