[flake8]
exclude=env/*,*/migrations/*,venv/*,local_settings.py,doc/*,deployment/*
ignore=F403,E128,E126,E123,E121,E203,E265,E501,W503
import-order-style = smarkets

[isort]
include_trailing_comma = true
line_length = 120
force_grid_wrap = 0
multi_line_output = 3
skip=migrations,node_modules

[coverage:run]
omit =
  */management/*
  */migrations/*
  admin.py
  */urls.py
