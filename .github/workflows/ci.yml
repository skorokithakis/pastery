# Python is pinned to 3.9 to match the Dockerfile. Do not bump it on its own:
# Django 2.0 cannot even be imported on 3.12+, because distutils was removed.
#
# Deploy is a job here rather than a separate workflow chained by workflow_run,
# so that it can require both checks and deploy the exact commit that passed.
name: CI

on:
  pull_request:
  push:
    branches:
      - master

permissions:
  contents: read

jobs:
  pre-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.9"
      # pre-commit/action@v3.0.1 is unmaintained and hardcodes
      # actions/cache@v4 (node 20) inside itself, so run the three steps it
      # performs directly instead. The 3.9 pin caps pip's resolution at
      # pre-commit 4.3.0, because 4.4 and newer need Python 3.10, so CI
      # deliberately runs an older pre-commit than a developer's machine will.
      - run: pip install pre-commit
      - uses: actions/cache@v6
        with:
          path: ~/.cache/pre-commit
          key: pre-commit-3|${{ env.pythonLocation }}|${{ hashFiles('.pre-commit-config.yaml') }}
      - run: pre-commit run --show-diff-on-failure --color=always --all-files --hook-stage=manual

  tests:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_PASSWORD: password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.9"
      - run: pip install uv==0.11.6
      # --locked: uv.lock deliberately holds older versions than a fresh
      # resolution would pick, so a silent re-lock must be an error.
      - run: uv sync --locked --no-install-project
      # Point Django at the PostgreSQL 18 service container. local_settings.py
      # is gitignored and is imported at the end of settings.py. Do not set
      # DATABASE_URL instead: that branch also switches sessions to Redis and
      # parses EMAIL_URL, which would raise.
      - run: |
          cat > pastery/local_settings.py <<'EOF'
          DATABASES = {
              "default": {
                  "ENGINE": "django.db.backends.postgresql",
                  "NAME": "postgres",
                  "USER": "postgres",
                  "PASSWORD": "password",
                  "HOST": "localhost",
                  "PORT": 5432,
              }
          }
          EOF
      # Fail CI when model changes are missing their migrations. Needs no
      # database and no collected static files.
      - run: uv run ./manage.py makemigrations --check --dry-run
      # Needed before the tests: settings use whitenoise's manifest storage,
      # so templates cannot render without a collected static manifest.
      - run: uv run ./manage.py collectstatic --noinput
      - run: uv run coverage run ./manage.py test
      - run: uv run coverage report

  # Nothing else verifies the image: no CI job builds it, so the Dockerfile is
  # first exercised by Dokku at deploy time, which would only surface a broken
  # image in production. Build it here, boot it with the Procfile's real
  # command, and prove uwsgi answers HTTP, so a bad image blocks the deploy.
  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: 🐳 Build the image
        run: docker build -t pastery .

      # misc/dokku/Procfile hardcodes this path, and UV_PROJECT_ENVIRONMENT
      # must keep delivering it. Assert it anyway, so a future change to that
      # mechanism fails here instead of at container boot.
      - name: 🔍 Assert the Procfile's uwsgi binary is in the image
        run: docker run --rm pastery test -x /usr/local/bin/uwsgi

      # Boot with the Procfile's real command and prove it serves HTTP. The
      # app has no Postgres or Redis here, so a 500 or an error page is a PASS:
      # the point is that pastery.wsgi:application imports cleanly and uwsgi
      # answers the socket. --need-app makes uwsgi refuse to start when the
      # app fails to load, instead of serving "no app loaded" 500s that would
      # pass this step vacuously. If it never answers, dump the container logs
      # and fail loudly so the reason (e.g. an ImportError) is visible.
      - name: 🚀 Boot uwsgi and check it answers HTTP
        run: |
          docker run -d --name pastery --publish 5000:5000 pastery \
            /usr/local/bin/uwsgi --need-app --chdir=/code/ --ini=/code/uwsgi.ini
          for i in $(seq 1 30); do
            if curl -s -m 5 -o /dev/null http://localhost:5000/; then
              # Any status, including a 500 from the missing Postgres/Redis,
              # is a pass — but only if the container is still running. An
              # exited container is uwsgi dying, not the app serving.
              if [ "$(docker inspect -f '{{.State.Running}}' pastery)" = "true" ]; then
                echo "uwsgi is serving HTTP on :5000 (any status is a pass; there is no DB here)"
                exit 0
              fi
              echo "uwsgi answered but the container exited" >&2
              docker logs pastery >&2 || true
              exit 1
            fi
            sleep 1
          done
          # No HTTP response within 30s: the WSGI app never loaded or uwsgi
          # never came up. Make the reason visible.
          echo "uwsgi never answered on :5000" >&2
          docker logs pastery >&2 || true
          exit 1

  deploy:
    runs-on: ubuntu-latest
    needs: [pre-commit, tests, docker]
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: 🔐 Setup SSH
        uses: webfactory/ssh-agent@v0.10.0
        with:
          ssh-private-key: ${{ secrets.DOKKU_SSH_KEY }}

      - name: 🔧 Configure SSH
        run: |
          mkdir -p ~/.ssh
          echo "Host projects.stavros.io" >> ~/.ssh/config
          echo "  Port 16022" >> ~/.ssh/config
          echo "  StrictHostKeyChecking no" >> ~/.ssh/config
          echo "  UserKnownHostsFile=/dev/null" >> ~/.ssh/config

      - name: 🚀 Deploy to Dokku
        run: |
          git remote add dokku dokku@projects.stavros.io:pastery
          git push dokku master
