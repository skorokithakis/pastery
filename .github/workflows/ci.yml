# Python is pinned to 3.9 to match the Dockerfile. Do not bump it on its own:
# Django 2.0 cannot even be imported on 3.12+, because distutils was removed.
#
# Deploy is a job here rather than a separate workflow chained by workflow_run,
# so that it can require both checks and deploy the exact commit that passed.
name: CI

on:
  pull_request:
  push:
    branches:
      - master

permissions:
  contents: read

jobs:
  pre-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.9"
      - uses: pre-commit/action@v3.0.1
        with:
          extra_args: '--all-files --hook-stage=manual'

  tests:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_PASSWORD: password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.9"
      - run: pip install poetry==1.4.0
      - run: poetry config virtualenvs.create false
      # Temporary prop for the pinned 2020-era dependency set: with
      # virtualenvs.create false, Poetry installs into the system Python and
      # downgrades its setuptools to the locked 67.6.0 partway through, so
      # any sdist built after that point races a half-swapped setuptools.
      # Pre-installing the locked version removes the swap. Deleted when the
      # project moves to uv.
      - run: pip install setuptools==67.6.0
      - run: poetry install --no-root
      # Point Django at the PostgreSQL 18 service container. local_settings.py
      # is gitignored and is imported at the end of settings.py. Do not set
      # DATABASE_URL instead: that branch also switches sessions to Redis and
      # parses EMAIL_URL, which would raise.
      - run: |
          cat > pastery/local_settings.py <<'EOF'
          DATABASES = {
              "default": {
                  "ENGINE": "django.db.backends.postgresql_psycopg2",
                  "NAME": "postgres",
                  "USER": "postgres",
                  "PASSWORD": "password",
                  "HOST": "localhost",
                  "PORT": 5432,
              }
          }
          EOF
      # Fail CI when model changes are missing their migrations. Needs no
      # database and no collected static files.
      - run: ./manage.py makemigrations --check --dry-run
      # Needed before the tests: settings use whitenoise's manifest storage,
      # so templates cannot render without a collected static manifest.
      - run: ./manage.py collectstatic --noinput
      - run: coverage run ./manage.py test
      - run: coverage report

  deploy:
    runs-on: ubuntu-latest
    needs: [pre-commit, tests]
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 🔐 Setup SSH
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.DOKKU_SSH_KEY }}

      - name: 🔧 Configure SSH
        run: |
          mkdir -p ~/.ssh
          echo "Host projects.stavros.io" >> ~/.ssh/config
          echo "  Port 16022" >> ~/.ssh/config
          echo "  StrictHostKeyChecking no" >> ~/.ssh/config
          echo "  UserKnownHostsFile=/dev/null" >> ~/.ssh/config

      - name: 🚀 Deploy to Dokku
        run: |
          git remote add dokku dokku@projects.stavros.io:pastery
          git push dokku master
