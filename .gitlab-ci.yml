image: python:latest

before_script:
  - pip install -Ur requirements.txt
  - python manage.py migrate
  - python manage.py collectstatic --noinput

stages:
  - staticcheck
  - typecheck
  - test

staticcheck:
  script:
    - flake8 .
  stage: staticcheck

typecheck:
  script:
    - mypy -s .
  stage: typecheck

test:
  script:
    - python manage.py test
  stage: test
