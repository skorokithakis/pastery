image: python:latest

stages:
  - staticcheck
  - typecheck
  - test
  - deploy

staticcheck:
  before_script:
    - pip install -U flake8
  script:
    - flake8 .
  stage: staticcheck

typecheck:
  before_script:
    - pip install -Ur requirements-dev.txt
  script:
    - mypy -s .
  stage: typecheck

test:
  before_script:
    - pip install pipenv
    - pipenv install --system
    - python manage.py migrate
    - python manage.py collectstatic --noinput
  script:
    - python manage.py test
  stage: test

deploy to production:
  image: ilyasemenov/gitlab-ci-git-push
  stage: deploy
  script:
    - git-push ssh://dokku@projects.stavros.io:16022/pastery
  environment: production
  only:
    - master
